[project]
name = "aura-monorepo"
version = "4.0.0"
description = "Aura Neuro-Psychometric Epistemic Source Separation & Cognitive Telemetry Engine (Tier 1 Science + Tier 2 FastAPI + SQLite WAL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["science", "backend"]
